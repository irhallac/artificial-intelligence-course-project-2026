<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Example spatial diagram</title>
  <desc id="desc">Ada is one square west of Bora. Ceren is one square south of Bora. North points upward.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g stroke="#d0d7de" stroke-width="1">
    <path d="M80 80H560M80 180H560M80 280H560"/>
    <path d="M120 40V320M320 40V320M520 40V320"/>
  </g>
  <g stroke="#57606a" stroke-width="3" fill="none">
    <path d="M320 180H520"/>
    <path d="M520 180V280"/>
  </g>
  <g fill="#ffffff" stroke="#24292f" stroke-width="3">
    <circle cx="320" cy="180" r="34"/>
    <circle cx="520" cy="180" r="34"/>
    <circle cx="520" cy="280" r="34"/>
  </g>
  <g fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <text x="320" y="187">Ada</text>
    <text x="520" y="187">Bora</text>
    <text x="520" y="287">Ceren</text>
  </g>
  <g stroke="#1f2328" stroke-width="3" fill="none">
    <path d="M110 128V65"/>
    <path d="M110 65L98 83M110 65L122 83"/>
  </g>
  <text x="110" y="52" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">N</text>
</svg>
